version: '3.8'

services:
  scylla-node1:
    image: scylladb/scylla:5.2
    container_name: scylla-node1
    hostname: scylla-node1
    networks:
      scylla-cluster:
        ipv4_address: 172.18.0.2
    ports:
      - "9042:9042"  # CQL port
    command: --smp 1 --memory 750M --overprovisioned 1 --seeds=scylla-node1

  scylla-node2:
    image: scylladb/scylla:5.2
    container_name: scylla-node2
    hostname: scylla-node2
    networks:
      scylla-cluster:
        ipv4_address: 172.18.0.3
    ports:
      - "9043:9042"
    command: --smp 1 --memory 750M --overprovisioned 1 --seeds=scylla-node1

  scylla-node3:
    image: scylladb/scylla:5.2
    container_name: scylla-node3
    hostname: scylla-node3
    networks:
      scylla-cluster:
        ipv4_address: 172.18.0.4
    ports:
      - "9044:9042"
    command: --smp 1 --memory 750M --overprovisioned 1 --seeds=scylla-node1

networks:
  scylla-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
